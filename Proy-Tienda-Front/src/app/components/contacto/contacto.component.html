<div class="container my-4">
    <h3 id="contactTitle">Contacto</h3>
    <div class="alert alert-success alert-dismissible fade show" role="alert" *ngIf="correoEnviado">
        Correo enviado correctamente.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" *ngIf="errorEnvio">
        Error al enviar el correo.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" *ngIf="FormularioInvalido">
        Error al completar el formulario.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form class="needs-validation" novalidate [formGroup]="contactoForm" (submit)="onSubmit()">
        <div class="mb-3 col-6">
            <label for="exampleInputEmail1" class="form-label">Correo</label>
            <input type="email" class="form-control" formControlName="correo" id="exampleInputEmail1"
                placeholder="name@example.com" required="email">
            <div class="invalid-feedback">
                Por favor, introduzca una dirección de email valida.
            </div>
        </div>
        <div class="mb-3 col-6">
            <label for="exampleInputNombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" formControlName="nombre" id="exampleInputNombre" required>
            <div class="invalid-feedback">
                Por favor, introduzca un nombre.
            </div>
            <div class="valid-feedback">
                Nombre correcto.
            </div>
        </div>
        <div class="mb-3 col-6">
            <label for="exampleInputAsunto" class="form-label">Asunto</label>
            <input type="text" class="form-control" formControlName="asunto" id="exampleInputAsunto" required>
            <div class="invalid-feedback">
                Por favor, introduzca un asunto.
            </div>
        </div>
        <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label">Mensaje</label>
            <textarea class="form-control" formControlName="mensaje" id="exampleFormControlTextarea1" rows="8"
                required></textarea>
            <div class="invalid-feedback">
                Por favor, introduzca un mensaje.
            </div>
        </div>
        <div class="input-group mb-3 col-6">
            <input type="file" class="form-control" formControlName="adjunto" id="inputGroupFile04"
                aria-describedby="inputGroupFileAddon04" aria-label="Upload" (change)="onFileSelected($event)" multiple>
        </div>
        <div class="mb-3 col-9" *ngIf="selectedFiles.length > 0">
            <label class="form-label">Archivos seleccionados:</label>
            <ul class="list-group">
                <li class="list-group-item" *ngFor="let file of selectedFiles; let i = index">
                    {{ file.name }}
                    <button type="button" class="btn-close float-end" (click)="removeFile(i)"
                        aria-label="Close"></button>
                </li>
            </ul>
        </div>
        <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
</div>
